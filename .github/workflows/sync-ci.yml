name: Sync Script CI

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Lint workflows (actionlint 1.7.7)
        run: |
          curl -sSfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Lint scripts (shellcheck, bash -n)
        run: |
          shellcheck .github/scripts/*.sh
          bash -n .github/scripts/*.sh
      - name: Test sync script
        run: .github/scripts/test-sync-upstream.sh
